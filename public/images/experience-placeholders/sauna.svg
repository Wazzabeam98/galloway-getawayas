<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Placeholder photograph: a wood-fired barrel sauna outdoors">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF1DF"/>
      <stop offset="1" stop-color="#EAD9BE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C88A54"/>
      <stop offset="1" stop-color="#A66E3D"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="url(#sky)"/>
  <!-- warm low sun -->
  <circle cx="242" cy="96" r="40" fill="#F6C97B" opacity="0.55"/>
  <!-- distant Galloway hills -->
  <path d="M0 250 Q80 206 168 244 T320 236 V300 H0 Z" fill="#8FA07A" opacity="0.55"/>
  <path d="M0 274 Q110 236 210 272 T320 266 V320 H0 Z" fill="#6F8460" opacity="0.7"/>
  <!-- pines behind -->
  <g fill="#4F6349">
    <path d="M60 250 l16 34 h-32 Z"/><path d="M60 232 l14 30 h-28 Z"/><rect x="57" y="284" width="6" height="12"/>
    <path d="M86 258 l13 28 h-26 Z"/><path d="M86 244 l11 24 h-22 Z"/><rect x="83" y="286" width="6" height="10"/>
  </g>
  <!-- ground -->
  <rect y="300" width="320" height="100" fill="#B9A57E"/>
  <rect y="300" width="320" height="14" fill="#A8926A"/>
  <!-- barrel sauna -->
  <g>
    <rect x="70" y="300" width="16" height="30" rx="3" fill="#7A5A34"/>
    <rect x="234" y="300" width="16" height="30" rx="3" fill="#7A5A34"/>
    <rect x="52" y="196" width="216" height="120" rx="60" fill="url(#wood)" stroke="#8A5C30" stroke-width="3"/>
    <g stroke="#8A5C30" stroke-width="2" opacity="0.55">
      <line x1="52" y1="230" x2="268" y2="230"/><line x1="52" y1="256" x2="268" y2="256"/><line x1="52" y1="282" x2="268" y2="282"/>
    </g>
    <!-- band hoops -->
    <rect x="96" y="196" width="6" height="120" fill="#6E4A28" opacity="0.6"/>
    <rect x="218" y="196" width="6" height="120" fill="#6E4A28" opacity="0.6"/>
    <!-- door with warm glow -->
    <circle cx="160" cy="256" r="40" fill="#3A2A1B"/>
    <circle cx="160" cy="256" r="40" fill="#F4B860" opacity="0.35"/>
    <circle cx="160" cy="256" r="26" fill="#2C2013"/>
    <!-- chimney + steam -->
    <rect x="196" y="176" width="12" height="26" rx="2" fill="#5B4028"/>
    <path d="M204 172 q10 -12 0 -24 q-10 -12 0 -24" fill="none" stroke="#E9DCC4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- placeholder caption bar (shared with the dining placeholder) -->
  <g>
    <rect x="0" y="358" width="320" height="42" fill="#2B2118" opacity="0.82"/>
    <text x="16" y="384" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial" font-size="17" font-weight="700" fill="#FBF1DF">Barrel sauna</text>
    <rect x="228" y="368" width="78" height="22" rx="11" fill="#F4B860"/>
    <text x="267" y="383" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial" font-size="10" font-weight="800" letter-spacing="1" fill="#2B2118">PLACEHOLDER</text>
  </g>
</svg>
