<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Placeholder photograph: a table of food, warm natural light">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF1DF"/>
      <stop offset="1" stop-color="#EAD9BE"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C88A54"/>
      <stop offset="1" stop-color="#A66E3D"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="url(#sky2)"/>
  <!-- warm window light, same low sun as the sauna set -->
  <circle cx="242" cy="96" r="40" fill="#F6C97B" opacity="0.55"/>
  <!-- window frame behind, warm interior -->
  <rect x="40" y="60" width="240" height="150" rx="10" fill="#F3E4C8"/>
  <line x1="160" y1="60" x2="160" y2="210" stroke="#D8C3A0" stroke-width="4"/>
  <line x1="40" y1="135" x2="280" y2="135" stroke="#D8C3A0" stroke-width="4"/>
  <path d="M40 250 Q120 214 210 250 T280 244" fill="none" stroke="#B9A57E" stroke-width="2" opacity="0.5"/>
  <!-- table -->
  <rect y="250" width="320" height="150" fill="url(#table)"/>
  <rect y="250" width="320" height="12" fill="#8A5C30" opacity="0.6"/>
  <!-- plate with food -->
  <ellipse cx="160" cy="312" rx="78" ry="26" fill="#000" opacity="0.12"/>
  <circle cx="160" cy="300" r="60" fill="#F4ECDD"/>
  <circle cx="160" cy="300" r="46" fill="#FBF6EC"/>
  <circle cx="150" cy="292" r="16" fill="#C0603C"/>
  <circle cx="176" cy="304" r="13" fill="#6F8460"/>
  <circle cx="158" cy="314" r="10" fill="#E0A94E"/>
  <!-- steam -->
  <g fill="none" stroke="#E9DCC4" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M150 258 q10 -12 0 -24 q-10 -12 0 -24"/>
    <path d="M172 258 q10 -12 0 -22 q-10 -10 0 -22"/>
  </g>
  <!-- cutlery -->
  <rect x="60" y="278" width="5" height="52" rx="2.5" fill="#E7D9BE"/>
  <rect x="255" y="278" width="5" height="52" rx="2.5" fill="#E7D9BE"/>
  <!-- placeholder caption bar (shared with the sauna placeholder) -->
  <g>
    <rect x="0" y="358" width="320" height="42" fill="#2B2118" opacity="0.82"/>
    <text x="16" y="384" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial" font-size="17" font-weight="700" fill="#FBF1DF">Dining</text>
    <rect x="228" y="368" width="78" height="22" rx="11" fill="#F4B860"/>
    <text x="267" y="383" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial" font-size="10" font-weight="800" letter-spacing="1" fill="#2B2118">PLACEHOLDER</text>
  </g>
</svg>
